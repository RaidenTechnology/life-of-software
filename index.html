<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Life of Software — Raiden</title>
  <style>
    html, body {
      margin: 0;
      padding: 0;
      background: #1e1e1e;
      height: 100%;
      overflow: hidden;
    }
    #game {
      width: 100%;
      height: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    canvas {
      image-rendering: pixelated;
    }
  </style>
</head>
<body>
  <div id="game"></div>

  <!-- ?v= on every game script: itch serves an updated build from the SAME url
       as the old one, so a returning player's browser will happily run last
       week's cached JS against this week's assets. (It bit us in local dev too:
       the server had the new file, the page kept running the old one.) Bump this
       number on every upload — same reason and same idiom as ASSET_V in
       BootScene. phaser.min.js is left alone: it never changes. -->
  <script src="lib/phaser.min.js"></script>
  <script src="src/sfx.js?v=35"></script>
  <script src="src/ui.js?v=35"></script>
  <script src="src/items.js?v=35"></script>
  <script src="src/battle.js?v=35"></script>
  <script src="src/data/languages.js?v=35"></script>
  <script src="src/data/glossary.js?v=35"></script>
  <script src="src/data/glossary_detail.js?v=35"></script>
  <script src="src/scenes/BootScene.js?v=35"></script>
  <script src="src/scenes/MenuScene.js?v=35"></script>
  <script src="src/scenes/PrologueScene.js?v=35"></script>
  <script src="src/scenes/GameScene.js?v=35"></script>
  <script src="src/scenes/EndScene.js?v=35"></script>
  <script src="src/main.js?v=35"></script>
</body>
</html>
